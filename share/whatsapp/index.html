<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-+UEDvzE35EsFt7+89xAJwowYl+tQb6P/zyJ8ZKLC8pY='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>WhatsApp post, Wednesday 11 November 2026</title>
<style>
:root{--blue:#003B5C;--gold:#85714D;--bg:#f6f4ef;--card:#fff;--ink:#1d2a33;--muted:#5b6670}
@media (prefers-color-scheme: dark){:root{--bg:#0f1a21;--card:#17252f;--ink:#e8eef2;--muted:#9fb0bc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Open Sans",system-ui,sans-serif}
header{background:var(--blue);color:#fff;padding:18px 16px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px}
.steps{font-size:14px;color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.primary{border-left:4px solid var(--gold)}
.card h2{margin:0 0 2px;font-size:17px}.note{margin:0 0 8px;font-size:13px;color:var(--muted)}
textarea{width:100%;border:1px solid rgba(127,127,127,.35);border-radius:8px;padding:10px;font-family:inherit;font-size:15px;line-height:1.45;background:transparent;color:inherit;resize:vertical}
.row{display:flex;gap:10px;margin-top:10px;align-items:center}
button{flex:1;min-height:48px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
button.ok{background:#1f7a3f}
.open{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--gold);color:inherit;text-decoration:none;font-weight:600}
.more{font-size:15px;color:var(--muted);margin:22px 0 10px}.warn{background:#fff4d6;color:#5a4300;padding:10px;border-radius:8px}
</style></head><body>
<header><h1>WhatsApp Channel post</h1><p>Wednesday 11 November 2026</p></header>
<main>
<p class="steps">Tap Copy, tap Open the channel (in WhatsApp Business), long-press the message box, Paste, Send.</p>

</main>
<script>document.querySelectorAll('button[data-copy]').forEach(function(b){b.addEventListener('click',function(){var t=document.getElementById(b.getAttribute('data-copy'));var done=function(){b.textContent='Copied';b.classList.add('ok');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(done,function(){t.select();document.execCommand('copy');done();});}else{t.select();document.execCommand('copy');done();}});});</script>
</body></html>
